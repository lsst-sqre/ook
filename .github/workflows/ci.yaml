name: CI

env:
  UV_VERSION: "0.12.4"

"on":
  merge_group: {}
  pull_request: {}
  push:
    branches-ignore:
      # These should always correspond to pull requests, so ignore them for
      # the push trigger and let them be triggered by the pull_request
      # trigger, avoiding running the workflow twice.  This is a minor
      # optimization so there's no need to ensure this is comprehensive.
      - "dependabot/**"
      - "gh-readonly-queue/**"
      - "renovate/**"
      - "t/**"
      - "tickets/**"
      - "u/**"
  release:
    types: [published]

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Run prek
        run: uv run --group=lint prek run --all-files

  typing:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Run nox
        run: uv run --group=nox nox -s typing

  test-unit:
    runs-on: ubuntu-latest
    # Unit tests run without testcontainers and finish in seconds; the
    # timeout only needs to cover dependency installation.
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Run nox
        run: uv run --group=nox nox -s test-unit

  test:
    runs-on: ubuntu-latest
    # Each shard runs roughly half of the container-backed suite plus about
    # a minute of testcontainer startup, so 20 minutes leaves headroom.
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        shard: ["1", "2"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Run nox
        # Coverage output is per-shard and informational only (there is no
        # coverage threshold or upload); shard membership is defined by
        # INFRA_TEST_SHARDS in noxfile.py.
        run: uv run --group=nox nox -s test-shard -- ${{ matrix.shard }}

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          # Ensure the documentation gets the right version.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Run nox
        run: uv run --group=nox nox -s docs

      # Only attempt documentation uploads for long-lived branches, tagged
      # releases, and pull requests from ticket branches.  This avoids version
      # clutter in the docs and failures when a PR doesn't have access to
      # secrets.
      - name: Upload to LSST the Docs
        uses: lsst-sqre/ltd-upload@v1
        with:
          project: ook
          dir: "docs/_build/html"
          username: ${{ secrets.LTD_USERNAME }}
          password: ${{ secrets.LTD_PASSWORD }}
        if: >
          github.event_name != 'merge_group'
          && (github.event_name != 'pull_request'
              || (startsWith(github.head_ref, 'tickets/')
                  || startsWith(github.head_ref, 't/')))

  build:
    concurrency:
      group: docker
      queue: max
    # Gating on typing and both test jobs preserves the old semantics, where
    # the single test job ran mypy and the full suite before build started.
    # typing and test-unit finish well before the test shards, so they do
    # not extend the critical path.
    needs: [typing, test-unit, test]
    secrets: inherit
    uses: lsst-sqre/multiplatform-build-and-push/.github/workflows/build.yaml@v4
    with:
      images: ghcr.io/${{ github.repository }}
      # Always build so the required `build / manifest` check reports on
      # every PR: a job skipped by its own `if:` creates no check-run at
      # all, and the required check hangs in "Expected" forever. Only push
      # on releases and ticket-branch PRs -- every other branch (u/,
      # dependabot/, renovate/, forks) builds as validation, and the
      # manifest job skips, which counts as passing.
      push: >-
        ${{ (github.event_name == 'release' && github.event.action == 'published')
            || startsWith(github.head_ref, 'tickets/')
            || startsWith(github.head_ref, 't/') }}
